<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jesús Delgado">
    <meta name="description" content="Cocktail Club es una base de datos de cócteles con recetas e imágenes.">
    <meta name="keywords" content="cócteles, recetas, bebidas, alcohol, base de datos">
    <title>Cocktail Club | Base de datos de cócteles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="fondo-nocturno">
  <header class="header">
    <div class="contenedor-header">
      <div class="logo-contenedor">
        <a href="index.html"><img src="img/cocktailclub_mini.png" alt="Logo Cocktail Club" class="logo-club-mini" /></a>
      </div>
      <!-- menú hamburguesa -->
      <button id="botonMenu" class="boton-hamburguesa" aria-label="Abrir menú">
        <span class="linea-hamburguesa"></span>
        <span class="linea-hamburguesa"></span>
        <span class="linea-hamburguesa"></span>
      </button>
      <nav id="menuNavegacion" class="menu-navegacion">
        <ul class="lista-menu">
          <li><a href="#buscador" class="enlace-menu">Buscador</a></li>
          <li><a href="#aleatorios" class="enlace-menu">Cócteles</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <!-- buscador -->
    <section id="buscador" class="mb-5 seccion-buscador">
      <div class="texto-presentacion text-center mb-3">
        <img src="img/cocktailclub_logo.png" alt="Logo Cocktail Club" class="logo-club mb-2 rounded-pill img-fluid" />
        <h1 class="titulo-principal">Descubre tu próximo cóctel</h1>
        <p class="texto-secundario">Busca por nombre o déjate sorprender con un cóctel sugerido.</p>
      </div>
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="input-group">
            <input type="text" id="entradaBusqueda" class="form-control" placeholder="Margarita, mojito, piña colada..." aria-label="Buscar cóctel" />
            <button id="botonBuscar" class="btn btn-primary">Buscar</button>
          </div>
        </div>
      </div>
      <div class="text-center mt-3">
        <button id="botonAleatorio" class="btn btn-outline-warning">Cóctel aleatorio</button>
      </div>
      <!-- alertas -->
      <div id="contenedorAlertas" class="mt-3"></div>
      <section id="destacado" class="mt-4">
        <div id="contenedorDestacado" class="contenedor-destacado row">
            <!-- card destacada -->
        </div>
        </section>
    </section>
    <!-- resultados de búsqueda -->
    <section id="resultados" class="mb-5">
      <div id="contenedorResultados" class="row gy-4">
        <!-- cards -->
      </div>
    </section>
    <!-- cócteles aleatorios -->
    <section id="aleatorios" class="mb-5">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="titulo-seccion">Algunos de nuestros cócteles</h2>
        <button id="botonRecargarAleatorios" class="btn btn-sm btn-outline-light">Ver otros cócteles</button>
      </div>
      <div id="contenedorAleatorios" class="row gy-4">
        <!-- 12 cards aleatorias -->
      </div>
    </section>
  </main>
  <footer id="footer" class="footer text-center py-3">
    <p class="mb-0">© 2025 Cocktail Club | Jesús Delgado</p>
  </footer>
  <!-- ventana modal -->
  <div id="modalFondo" class="modal-fondo oculto">
    <div class="modal-contenido">
      <button id="botonCerrarModal" class="boton-cerrar-modal" aria-label="Cerrar">
        &times;
      </button>
      <div id="contenidoModal">
        <!-- info del cóctel -->
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
